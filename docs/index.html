<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>Мои новости</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --line: #e4e2dc;
    --accent: #1f5fbf;
    --new: #d9480f;
    --chip: #ecebe6;
    --corp: #1e7a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --card: #202226;
      --text: #ececee;
      --muted: #9a9aa2;
      --line: #2e3036;
      --accent: #7aa7ff;
      --new: #ff8a4c;
      --chip: #2a2c31;
      --corp: #5fcf94;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header h1 { font-size: 24px; margin: 8px 0 2px; }
  .updated { color: var(--muted); font-size: 13px; }

  .tabs { display: flex; gap: 4px; overflow-x: auto; margin: 14px 0 4px; border-bottom: 1px solid var(--line); }
  .tabs button { white-space: nowrap;
    border: 0; background: none; color: var(--muted); font-size: 15px; font-weight: 600;
    padding: 8px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }

  .filters { display: flex; gap: 8px; margin: 12px 0 6px; }
  .filters button {
    border: 0; border-radius: 999px; padding: 7px 14px;
    background: var(--chip); color: var(--text); font-size: 14px; cursor: pointer;
  }
  .filters button.on { background: var(--accent); color: #fff; }

  details.topic { margin-top: 18px; }
  details.topic > summary {
    list-style: none; cursor: pointer;
    font-size: 19px; font-weight: 700; padding: 6px 0;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  details.topic > summary::-webkit-details-marker { display: none; }
  .count { color: var(--muted); font-size: 14px; font-weight: 400; }
  h3.sub { font-size: 14px; text-transform: uppercase; letter-spacing: .03em;
    color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
  h2.block { font-size: 18px; margin: 20px 0 4px; }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

  .card {
    cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .card .title { font-weight: 600; margin: 0 0 4px; }
  .card .title .dot { color: var(--new); margin-right: 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .tag { background: var(--chip); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
  .tag.corp { color: var(--corp); }
  .summary { margin: 0 0 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
  .actions a, .actions button, .report button, .report a {
    color: var(--accent); background: none; border: 0; padding: 0;
    font: inherit; cursor: pointer; text-decoration: none;
  }
  .full {
    display: none; white-space: pre-wrap; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--line); font-size: 15px;
  }
  .full.open { display: block; }
  .empty { color: var(--muted); margin-top: 32px; text-align: center; }

  .daily {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 12px 14px; margin: 14px 0 4px;
  }
  .daily .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .daily p { margin: 0; }
  .report {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .report .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 14px; }
  .report .name { font-weight: 600; font-size: 16px; margin-right: auto; }
  .report .items { margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Мои новости</h1>
    <div class="updated" id="updated">Загрузка…</div>
  </header>

  <nav class="tabs" id="tabs">
    <button id="tabNews" class="on">Новости</button>
  </nav>

  <section id="newsView">
    <div id="daily"></div>
    <div class="filters">
      <button id="btnNew" class="on">Новые</button>
      <button id="btnToday">Сегодня</button>
      <button id="btnAll">Все за неделю</button>
    </div>
    <main id="list"></main>
  </section>

  <section id="archiveView" hidden>
    <h2 class="block">Текущий период</h2>
    <p class="note" id="archiveNote"></p>
    <div id="archiveList"></div>
    <h2 class="block">Отчёты</h2>
    <div id="reportList"></div>
  </section>
</div>

<script>
var allNews = [];
var topics = {};
var archives = [];       // список архивов из archives.json
var archiveData = {};    // key -> { items, index } (загружается при открытии вкладки)
var mode = "new";

// прочитанные новости: id -> когда отмечена (хранится только в этом браузере)
var readIds = {};
try {
  readIds = JSON.parse(localStorage.getItem("readIds") || "{}");
} catch (e) {
  readIds = {};
}

// убираем отметки старше 8 дней — таких новостей уже нет в ленте
var weekAgo = Date.now() - 8 * 24 * 60 * 60 * 1000;
for (var oldId in readIds) {
  if (readIds[oldId] < weekAgo) delete readIds[oldId];
}

function markRead(item) {
  if (readIds[item.id]) return;
  readIds[item.id] = Date.now();
  try { localStorage.setItem("readIds", JSON.stringify(readIds)); } catch (e) {}
}

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function formatTime(iso) {
  var d = new Date(iso);
  return d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function formatDay(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
}

// новость появилась в ленте сегодня (по времени вашего телефона)
// берём время, когда скрипт её добавил, а у старых новостей — время публикации
function isTodayItem(item) {
  var d = new Date(item.added_at || item.date);
  var now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

// «Новые» — сегодняшние, на которые вы ещё не нажимали.
// После полуночи все вчерашние уходят только во «Все за неделю».
function isNewItem(item) {
  return isTodayItem(item) && !readIds[item.id];
}

// «Сегодня» — сегодняшние, которые вы уже открыли
function isReadTodayItem(item) {
  return isTodayItem(item) && readIds[item.id];
}

function makeCard(item, showTopic) {
  var card = el("div", "card");
  var isNew = isNewItem(item);

  var title = el("p", "title");
  var dot = el("span", "dot", "●");
  if (isNew) title.appendChild(dot);
  title.appendChild(document.createTextNode(item.short));
  card.appendChild(title);

  // нажатие на карточку отмечает новость прочитанной: точка пропадает,
  // а в «Сегодня» она переедет при следующем открытии страницы или смене фильтра
  card.addEventListener("click", function () {
    markRead(item);
    if (dot.parentNode) dot.parentNode.removeChild(dot);
  });

  var meta = el("div", "meta");
  meta.appendChild(document.createTextNode(formatTime(item.date) + " · "));
  if (showTopic) meta.appendChild(el("span", "tag", item.subtopic));
  if (item.region) meta.appendChild(el("span", "tag", item.region));
  if (!showTopic) {
    for (var a = 0; a < archives.length; a++) {
      if (item[archives[a].key]) meta.appendChild(el("span", "tag corp", archives[a].title));
    }
  }
  var channels = [];
  for (var i = 0; i < item.sources.length; i++) channels.push(item.sources[i].channel);
  meta.appendChild(document.createTextNode(channels.join(", ")));
  card.appendChild(meta);

  if (item.summary) card.appendChild(el("p", "summary", item.summary));

  var actions = el("div", "actions");
  var full = el("div", "full", item.text);
  var toggle = el("button", "", "Полный текст");
  toggle.onclick = function () {
    full.classList.toggle("open");
    toggle.textContent = full.classList.contains("open") ? "Свернуть" : "Полный текст";
  };
  actions.appendChild(toggle);

  for (var j = 0; j < item.sources.length; j++) {
    var link = el("a", "", "Источник: " + item.sources[j].channel + " ↗");
    link.href = item.sources[j].link;
    link.target = "_blank";
    link.rel = "noopener";
    actions.appendChild(link);
  }
  card.appendChild(actions);
  card.appendChild(full);
  return card;
}

// ---------- вкладка «Новости» ----------

function renderNews() {
  var list = document.getElementById("list");
  list.innerHTML = "";

  var shown = [];
  for (var i = 0; i < allNews.length; i++) {
    var item = allNews[i];
    if (mode === "all") shown.push(item);
    if (mode === "new" && isNewItem(item)) shown.push(item);
    if (mode === "today" && isReadTodayItem(item)) shown.push(item);
  }
  shown.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

  if (shown.length === 0) {
    var emptyText = "Пока пусто.";
    if (mode === "new") emptyText = "Новых новостей нет. Загляните в «Сегодня» или «Все за неделю».";
    if (mode === "today") emptyText = "Сегодня вы ещё ничего не открыли. Непрочитанное — в «Новых».";
    list.appendChild(el("p", "empty", emptyText));
    return;
  }

  for (var topic in topics) {
    var inTopic = [];
    for (var k = 0; k < shown.length; k++) {
      if (shown[k].topic === topic) inTopic.push(shown[k]);
    }
    if (inTopic.length === 0) continue;

    var section = el("details", "topic");
    if (topic !== "Другое") section.open = true;
    var head = el("summary", "", topic);
    head.appendChild(el("span", "count", String(inTopic.length)));
    section.appendChild(head);

    var subs = topics[topic];
    for (var s = 0; s < subs.length; s++) {
      var inSub = [];
      for (var m = 0; m < inTopic.length; m++) {
        if (inTopic[m].subtopic === subs[s]) inSub.push(inTopic[m]);
      }
      if (inSub.length === 0) continue;
      if (subs[s] !== topic) section.appendChild(el("h3", "sub", subs[s]));
      for (var n = 0; n < inSub.length; n++) section.appendChild(makeCard(inSub[n], false));
    }
    list.appendChild(section);
  }
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById("btnNew").className = mode === "new" ? "on" : "";
  document.getElementById("btnToday").className = mode === "today" ? "on" : "";
  document.getElementById("btnAll").className = mode === "all" ? "on" : "";
  renderNews();
}

// ---------- вкладки архивов («Финансы компаний», «Машиностроение», …) ----------

function renderArchive(archive) {
  var data = archiveData[archive.key];
  var items = data.items;
  var index = data.index;

  // начало текущего периода: конец последнего отчёта или начало сбора
  var periodStart = archive.start + "T00:00:00+03:00";
  var reports = index.reports;
  if (reports.length > 0) periodStart = reports[reports.length - 1].to;
  var startTime = new Date(periodStart).getTime();

  var current = [];
  for (var i = 0; i < items.length; i++) {
    if (new Date(items[i].date).getTime() >= startTime) current.push(items[i]);
  }
  current.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

  document.getElementById("archiveNote").textContent =
    "С " + formatDay(periodStart) + " · собрано новостей: " + current.length;

  var list = document.getElementById("archiveList");
  list.innerHTML = "";
  if (current.length === 0) list.appendChild(el("p", "note", "Пока ничего не собрано."));
  for (var j = 0; j < current.length; j++) list.appendChild(makeCard(current[j], true));

  var reportList = document.getElementById("reportList");
  reportList.innerHTML = "";
  if (reports.length === 0) {
    reportList.appendChild(el("p", "note", "Первый отчёт придёт 28 ноября."));
    return;
  }
  for (var r = reports.length - 1; r >= 0; r--) reportList.appendChild(makeReport(archive, reports[r]));
}

function makeReport(archive, report) {
  var folder = "reports/" + archive.key + "/";
  var box = el("div", "report");
  var row = el("div", "row");
  row.appendChild(el("span", "name", formatDay(report.from) + " – " + formatDay(report.to)));
  row.appendChild(el("span", "count", report.count + " новостей"));

  var items = el("div", "items");
  var loaded = false;
  var show = el("button", "", "Показать");
  show.onclick = function () {
    if (items.hidden === false && loaded) {
      items.hidden = true;
      show.textContent = "Показать";
      return;
    }
    items.hidden = false;
    show.textContent = "Скрыть";
    if (loaded) return;
    items.textContent = "Загрузка…";
    getJson(folder + report.name + ".json", []).then(function (data) {
      loaded = true;
      items.textContent = "";
      data.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      for (var i = 0; i < data.length; i++) items.appendChild(makeCard(data[i], true));
    });
  };
  row.appendChild(show);

  var csvLink = el("a", "", "Скачать CSV");
  csvLink.href = folder + report.name + ".csv";
  csvLink.setAttribute("download", "otchet_" + archive.key + "_" + report.name + ".csv");
  row.appendChild(csvLink);

  box.appendChild(row);
  items.hidden = true;
  box.appendChild(items);
  return box;
}

function openArchive(archive) {
  if (archiveData[archive.key]) {
    renderArchive(archive);
    return;
  }
  document.getElementById("archiveNote").textContent = "Загрузка…";
  document.getElementById("archiveList").innerHTML = "";
  document.getElementById("reportList").innerHTML = "";
  Promise.all([
    getJson(archive.key + ".json", []),
    getJson("reports/" + archive.key + "/index.json", { start: archive.start, reports: [] })
  ]).then(function (results) {
    archiveData[archive.key] = { items: results[0], index: results[1] };
    renderArchive(archive);
  });
}

// ---------- итог дня ----------

function renderDaily(daily) {
  var box = document.getElementById("daily");
  box.innerHTML = "";
  if (!daily || daily.length === 0) return;
  var last = daily[daily.length - 1];
  var card = el("div", "daily");
  var d = new Date(last.date + "T12:00:00+03:00");
  card.appendChild(el("div", "label", "Итог дня · " + d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" })));
  card.appendChild(el("p", "", last.text));
  box.appendChild(card);
}

// ---------- переключение вкладок ----------

function setTab(key) {
  var buttons = document.getElementById("tabs").children;
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].className = buttons[i].getAttribute("data-key") === key ? "on" : "";
  }
  document.getElementById("newsView").hidden = key !== "news";
  document.getElementById("archiveView").hidden = key === "news";
  history.replaceState(null, "", key === "news" ? "#" : "#" + key);
  for (var j = 0; j < archives.length; j++) {
    if (archives[j].key === key) openArchive(archives[j]);
  }
}

function makeTabs() {
  var nav = document.getElementById("tabs");
  var newsButton = document.getElementById("tabNews");
  newsButton.setAttribute("data-key", "news");
  newsButton.onclick = function () { setTab("news"); };
  for (var i = 0; i < archives.length; i++) {
    var button = el("button", "", archives[i].title);
    button.setAttribute("data-key", archives[i].key);
    button.onclick = (function (key) {
      return function () { setTab(key); };
    })(archives[i].key);
    nav.appendChild(button);
  }
}

document.getElementById("btnNew").onclick = function () { setMode("new"); };
document.getElementById("btnToday").onclick = function () { setMode("today"); };
document.getElementById("btnAll").onclick = function () { setMode("all"); };

// ---------- загрузка данных ----------

function getJson(name, fallback) {
  return fetch(name + "?t=" + Date.now())   // ?t= чтобы браузер не показывал старую версию
    .then(function (r) { return r.ok ? r.json() : fallback; })
    .catch(function () { return fallback; });
}

Promise.all([
  getJson("news.json", null),
  getJson("topics.json", {}),
  getJson("archives.json", [{ key: "corp_finance", title: "Финансы компаний", start: "2026-10-20" }]),
  getJson("daily.json", [])
]).then(function (results) {
  archives = results[2];
  makeTabs();
  renderDaily(results[3]);

  // открыть вкладку из ссылки (например, из уведомления с отчётом)
  var hashKey = location.hash.replace("#", "");
  if (hashKey === "corp") hashKey = "corp_finance";
  var startTab = "news";
  for (var a = 0; a < archives.length; a++) {
    if (archives[a].key === hashKey) startTab = hashKey;
  }

  if (results[0] === null) {
    document.getElementById("updated").textContent = "Данных пока нет — дождитесь первого запуска.";
    setTab(startTab);
    return;
  }
  allNews = results[0];
  topics = results[1];

  var newest = "";
  for (var i = 0; i < allNews.length; i++) {
    if (allNews[i].date > newest) newest = allNews[i].date;
  }
  document.getElementById("updated").textContent =
    newest ? "Последняя новость: " + formatTime(newest) : "Новостей пока нет";

  var hasNew = false;
  for (var j = 0; j < allNews.length; j++) {
    if (isNewItem(allNews[j])) hasNew = true;
  }
  // нет непрочитанных — показываем «Сегодня», а если и там пусто — всю неделю
  var hasToday = false;
  for (var t = 0; t < allNews.length; t++) {
    if (isReadTodayItem(allNews[t])) hasToday = true;
  }
  if (hasNew) setMode("new");
  else if (hasToday) setMode("today");
  else setMode("all");
  setTab(startTab);
});
</script>
</body>
</html>
